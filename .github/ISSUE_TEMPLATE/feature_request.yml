name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Check the [roadmap](../blob/main/docs/SPEC.md#5-four-phase-execution-roadmap) first — it may already be planned.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives / prior art (e.g. how TablePlus, DBeaver or Postman do it)
